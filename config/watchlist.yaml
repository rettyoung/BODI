# Party watch: a filing BY any of these in a watched docket is material by default (customer and
# intervenor briefs carry the terms utilities later concede). The collector tags matches as party_hits.
parties: [Microsoft, Google, Alphabet, Amazon, "Amazon Data Services", AWS, Meta, Oracle, OpenAI, CoreWeave,
  "Data Center Coalition", "Digital Realty", Equinix, QTS, "STACK Infrastructure", Vantage, "Aligned Data Centers",
  "CyrusOne", "Compass Datacenters", Crusoe, "Applied Digital", Constellation, Vistra, NRG, Talen,
  "Retail Energy Advancement League", "Clean Energy Buyers Association", "Walmart", "Texas Industrial Energy Consumers",
  "Southern Environmental Law Center", "Sierra Club", "Appalachian Voices", "Office of Public Utility Counsel"]

rtos: [PJM, MISO, SPP, ERCOT, CAISO, NYISO, ISO-NE, Western Power Pool / WRAP]

# EDGAR. Tickers resolve to CIKs at run time via sec.gov/files/company_tickers.json; explicit CIKs win.
edgar:
  forms: [8-K, 10-Q, 10-K, 40-F, 6-K]
  eight_k_items: ["2.02", "7.01", "8.01", "1.01", "2.01"]
  utilities: {AEP: AEP, Southern: SO, Duke: DUK, Dominion: D, Entergy: ETR, Evergy: EVRG, Exelon: EXC,
              Ameren: AEE, PPL: PPL, Pinnacle West: PNW, Xcel: XEL, OGE Energy: OGE, TXNM Energy: "0001108426",
              Oncor: "0001193311", Fortis: "0001666175", Nevada Power: "0000071180", NiSource: NI, FirstEnergy: FE}
  market_participants: {Constellation: CEG, Vistra: VST, NRG: NRG, Talen: TLN, NextEra: NEE, Microsoft: MSFT,
                        Alphabet: GOOGL, Amazon: AMZN, Meta: META, Oracle: ORCL, Digital Realty: DLR, Equinix: EQIX,
                        CoreWeave: CRWV, Applied Digital: APLD, IREN: IREN, Core Scientific: CORZ, GE Vernova: GEV}
  full_text_queries: ['"large load" tariff', '"data center" "electric service agreement"', '"co-location" FERC']

federal_register:
  agencies: [federal-energy-regulatory-commission, energy-department, environmental-protection-agency,
             nuclear-regulatory-commission, executive-office-of-the-president]
  terms: ["large load", "data center", "co-location", "colocation", "resource adequacy", "interconnection",
          "202(c)", "artificial intelligence infrastructure", "grid reliability", "restart", "power uprate",
          "small modular reactor", "loan guarantee"]

# Page watchers: list pages whose new links become candidates. render=true uses headless Chromium.
# verify=true means the URL is seeded from knowledge and is checked on first run; failures show in health.
watch_pages:
  - {id: grda_board,   jur: OK,   url: "https://www.grda.com/leadership/board-meeting-agenda-minutes/", link: "agenda|minutes|board", render: true}
  - {id: ks_minutes,   jur: KS,   url: "https://www.kcc.ks.gov/commission-activity/meeting-minutes", link: "\\.pdf"}
  - {id: la_news,      jur: LA,   url: "https://lpsc.louisiana.gov/", link: "\\.pdf|DocumentDetails"}
  - {id: ferc_news,    jur: FERC, url: "https://www.ferc.gov/news-events/news", link: "/news-events/news/", verify: true}
  - {id: nerc_news,    jur: US-Federal, url: "https://www.nerc.com/news/Pages/default.aspx", link: "news|\\.pdf", verify: true}
  - {id: caiso_news,   jur: FERC, rto: CAISO, url: "https://www.caiso.com/about/news/news-releases/", link: "news|\\.pdf", render: true}
  - {id: ercot_news,   jur: TX,   rto: ERCOT, url: "https://www.ercot.com/news/releases", link: "/news/", verify: true}
  - {id: spp_news,     jur: FERC, rto: SPP, url: "https://www.spp.org/newsroom/", link: "newsroom|\\.pdf", verify: true}
  - {id: nyiso_press,  jur: FERC, rto: NYISO, url: "https://www.nyiso.com/press-releases", link: "press|\\.pdf", verify: true, render: true}
  - {id: isone_press,  jur: FERC, rto: ISO-NE, url: "https://www.iso-ne.com/about/news-media/press-releases", link: "press|news", verify: true}
  - {id: miso_news,    jur: FERC, rto: MISO, url: "https://www.misoenergy.org/meet-miso/media-center/", link: "media-center|\\.pdf", verify: true, render: true}
  - {id: wpp_news,     jur: FERC, rto: Western Power Pool / WRAP, url: "https://www.westernpowerpool.org/news", link: "news", verify: true}

  # Arizona and Kansas governors' sites and Duke's IRP page refuse automated clients (403, checked 2026-10-02).
