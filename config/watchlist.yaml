  # ---- Recommendation 4: ERCOT. The market-notice ARCHIVE page is public HTML (3-year archive; robots allows it);
  # the old mkt_notices URL 404s and rendered pages hit Incapsula. Plain fetch of the archive, notices M-xxxxxx-xx.
