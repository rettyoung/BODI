# Grid Docket watchlist — the single place to add or drop coverage.
# The nightly collector reads this; the Monday Sweep reads it to classify.
# Edit freely: a docket added here is collected the next night.
#
# route per jurisdiction:
#   collector  - GitHub Actions adapter reads primary filings in full (cloud)
#   webfetch   - the Sweep reads primary filings with Claude's web reader (cloud)
#   manual     - the agency refuses automated access; primary filings come from the
#                manual pass on Rett's computer, plus cloud fallbacks (mirrors, mail, search)

user_agent: "BlueOwl-RegTracker/4.0 (rett.young@blueowl.com)"

keywords: [large load, large-load, data center, data centre, hyperscale, colocation, co-location,
  co-located, behind-the-meter, interconnection, load interconnection, queue, capacity auction,
  resource adequacy, minimum bill, minimum demand, contract demand, exit fee, collateral,
  ESA, electric service agreement, energy service agreement, special contract, economic development rate,
  crypto, bitcoin, mining load, transmission service, network upgrade, CIAC, contribution in aid,
  CPCN, certificate of public convenience, IRP, integrated resource plan, RFP, gas turbine,
  combined cycle, nuclear, SMR, uprate, battery storage, curtailment, flexible load, demand response,
  ratepayer protection, cost allocation, cost shift]

jurisdictions:
  FERC: {route: collector, adapter: ferc}
  AZ:   {route: collector, adapter: az_acc}
  GA:   {route: collector, adapter: ga_psc}
  TX:   {route: collector, adapter: tx_puct}
  LA:   {route: collector, adapter: la_lpsc}
  MO:   {route: collector, adapter: mo_efis}
  NM:   {route: collector, adapter: nm_prc}
  KS:   {route: collector, adapter: ks_kcc, note: "minutes PDFs + kcc-connect; Evergy ESAs are never docketed"}
  OK:   {route: collector, adapter: ok_occ, note: "GRDA board pages + OCC WebLink"}
  AL:   {route: collector, adapter: al_psc}
  PA:   {route: webfetch, note: "puc.pa.gov refuses GitHub runners at TLS; Claude's reader works (v1 verified)"}
  NV:   {route: manual, note: "puc.nv.gov robots.txt disallows all bots; pucweb1 holds pre-Oct-2023 dockets only; no text layer"}
  VA:   {route: manual, note: "SCC robots.txt admits named search engines only"}
  NC:   {route: manual, note: "NCUC behind a Cloudflare challenge"}
  SC:   {route: manual, note: "DMS robots.txt disallows all bots"}
  IL:   {route: manual, note: "ICC robots.txt disallows all bots; CAPTCHA wall"}
  OH:   {route: manual, note: "PUCO DIS firewall rejects automated clients"}
  WV:   {route: manual, note: "PSC returns 403 to automated clients"}

