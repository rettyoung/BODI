# ---- Recommendation 3: interconnection queues (monthly snapshot; deltas for tracked states).
# PJM and ERCOT publish their queues behind registration (PJM Planning API key; ERCOT MIS); add them once
# a key exists. MISO and SPP cover KS, OK, NM, LA, MO, IL, TX (non-ERCOT) and parts of others.
queues:
  - {id: miso, name: MISO, rto: MISO, jur: FERC, url: "https://www.misoenergy.org/api/giqueue/getprojects",
     page: "https://www.misoenergy.org/planning/resource-utilization/GI_Queue/gi-interactive-queue/", verify: true}
  - {id: spp, name: SPP, rto: SPP, jur: FERC, url: "https://opsportal.spp.org/Studies/GenerateActiveCSV",
     page: "https://opsportal.spp.org/Studies/GIActive", verify: true}

# ---- Recommendation 2: keyed APIs (adapters skip quietly until the repo secret exists)
openstates_queries: ["data center", "large load", "electric service agreement"]

# ---- Recommendation 6: courts (CourtListener; COURTLISTENER_TOKEN secret optional, enables docket search)
court_queries:
  # state appellate courts first (keyless runs read only the first two queries). The Texas courts of appeals'
  # own site (TAMES) disallows crawlers, so their opinions come from here; the 15th Court of Appeals has heard
  # appeals of state-agency (PUC) decisions since 2024-09-01.
  - {q: '"Public Utility Commission" OR "Public Utilities Commission" OR "Public Service Commission" OR "Corporation Commission" OR "Electric Reliability Council" OR "Utilities Commission"',
     court: "texapp tex pacommwct pa ohio wva va vactapp ncctapp nc sc scctapp illappct ill ga gactapp ariz arizctapp la lactapp mo moctapp kan kanctapp okla oklacivapp nm nmctapp nev nevapp ala alacivapp"}
  - '"large load" AND (tariff OR commission OR FERC)'
  - '"data center" AND ("public service commission" OR "corporation commission" OR "public utility commission")'
  - '"co-location" AND (PJM OR FERC)'
  - 'Microsoft AND "State Corporation Commission"'
  - '"Retail Energy Advancement League"'
  - 'Constellation AND PJM AND (colocation OR "co-location")'

# ---- Recommendation 8: county and city agendas (Legistar Web API). Verified 2026-10-02. Loudoun, Fairfax,
# Henrico, Fulton, Atlanta, Tulsa and Reno are not on Legistar's API (checked); Loudoun/Fairfax/Henrico
# agendas would need their own (Granicus/BoardDocs) pages.
legistar_filter: "data ?cent|hyperscale|server farm|large load|data processing"
legistar:
  - {client: pwcgov, name: "Prince William County, VA", jur: VA}
  - {client: maricopa, name: "Maricopa County, AZ", jur: AZ}
  - {client: phoenix, name: "City of Phoenix, AZ", jur: AZ}
  - {client: mesa, name: "City of Mesa, AZ", jur: AZ}
  - {client: columbus, name: "City of Columbus, OH", jur: OH}
  - {client: sanantonio, name: "City of San Antonio, TX", jur: TX}
  - {client: fortworthgov, name: "City of Fort Worth, TX", jur: TX}
  - {client: kansascity, name: "Kansas City, MO", jur: MO}
  - {client: washoe-nv, name: "Washoe County, NV", jur: NV}    # added 2026-10-03 (Reno-area campuses)

# ---- Wave 3 (2026-10-03): local agendas outside Legistar (adapter: agendas). A new agenda document or meeting
# page is fetched and kept only if its text matches agenda_filter (or the entry's own text_filter).
# Not collectable (checked 2026-10-03): Loudoun (packets on lfportal.loudoun.gov, whose robots.txt cannot be read,
# = disallow; loudoun.granicus.com disallows crawlers), City of Reno (reno.primegov.com disallows crawlers),
# Fulton County (agenda list is not in the page HTML). Fairfax Planning Commission posts only monthly calendars;
# its data-center cases reach the Board's land-use agenda, which is read.
agenda_filter: "data ?cent|datacenter|hyperscale|server farm|data processing|large load|substation|critical facility|technology campus|zoning text amendment"
agendas:
  - {id: atlanta, name: "City of Atlanta, GA", jur: GA, url: "https://atlantacityga.iqm2.com/Services/RSS.aspx?Feed=Calendar",
     heading_pairs: true, link: "Detail_Meeting\\.aspx", title_filter: "(Atlanta City Council|Zoning|Community Development|Utilities|Transportation)[^—]*- Agenda -", max_new: 4}
  # Storey County (Tahoe Reno Industrial Center): its RSS points at nv-storeycounty.civicplus.com, whose robots.txt
  # disallows crawlers; the county's own AgendaCenter page links the same agenda files on www.storeycounty.org.
  - {id: storey, name: "Storey County, NV", jur: NV, url: "https://www.storeycounty.org/AgendaCenter", link: "/AgendaCenter/ViewFile/Agenda/"}
  - {id: tulsa_council, name: "Tulsa City Council, OK", jur: OK, url: "https://www.tulsacouncil.org/", link: "COTDisplayDocument/\\?DocumentType=Agenda"}
  - {id: tulsa_tmapc, name: "Tulsa Metropolitan Area Planning Commission, OK", jur: OK, url: "https://tulsaplanning.org/boards/pc/agenda/", link: "tulsaplanning\\.org/agendas/"}
  - {id: tulsa_boa, name: "Tulsa Board of Adjustment, OK", jur: OK, url: "https://tulsaplanning.org/boards/boa/agenda/", link: "tulsaplanning\\.org/agendas/"}
  - {id: henrico, name: "Henrico County, VA", jur: VA, url: "https://henrico.gov/supervisors/supervisors-agenda-o-gram/", link: "/pdfs/manager/meetings\\d{4}/\\d{5,6}ag\\.pdf"}
  # Fairfax meeting pages carry a site menu that says "Data Centers", so the match must sit next to a land-use action.
  - {id: fairfax_bos, name: "Fairfax County Board of Supervisors, VA", jur: VA, url: "https://www.fairfaxcounty.gov/boardofsupervisors/2026-board-meetings",
     text_filter: "(rezoning|special exception|zoning ordinance amendment|\\bZOA\\b|public hearing|proffer|plan amendment|moratorium)[^.]{0,250}data ?cent|data ?cent[^.]{0,250}(rezoning|special exception|zoning ordinance|\\bZOA\\b|public hearing|proffer|plan amendment|moratorium)",
     link: "/boardofsupervisors/([a-z]{3,9}-\\d{1,2}-\\d{4}-meeting|board-supervisors-(land-use-policy|environmental)-committee-meeting-[a-z]+-\\d{1,2}-\\d{4})$"}

# ---- Wave 3: Supreme Court of Texas orders filter (adapter: courts_state)
