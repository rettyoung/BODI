  - {id: gov_va, jur: VA, url: "https://www.governor.virginia.gov/newsroom/news-releases/", link: "news-releases/", verify: true}
  - {id: gov_ga, jur: GA, url: "https://gov.georgia.gov/press-releases", link: "press-releases/", verify: true}
  - {id: gov_pa, jur: PA, url: "https://www.pa.gov/governor/newsroom", link: "newsroom", verify: true}
  - {id: gov_oh, jur: OH, url: "https://governor.ohio.gov/media/news-and-media", link: "news-and-media/", verify: true, render: true}
  - {id: gov_la, jur: LA, url: "https://gov.louisiana.gov/news/", link: "/news/", verify: true, render: true}
