# ---- Wave 3: LBNL and DOE-lab studies via OSTI (adapter: studies). emp.lbl.gov refuses the runners (HTTP 403).
osti_queries:
  - {org: LBNL, q: '"interconnection queue" OR "queued up"', title_filter: "queue|interconnection"}
  - {org: LBNL, q: '"data center" AND (electricity OR energy)', title_filter: "data cent|datacent"}
  - {org: LBNL, q: '"load growth" OR "large loads" OR "electricity demand"', title_filter: "load growth|large loads?|electricity (demand|use|consumption)|load forecast|data cent"}
