name: reachability-probe
on:
  push:
    paths:
      - 'probe/*.py'
      - 'probe/targets.json'
      - '.github/workflows/probe.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Run probe
        run: python probe/probe.py
      - name: Commit results
        run: |
          git config user.name "griddocket-probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/results
          git commit -m "probe results $(date -u +%FT%TZ)" || exit 0
          git pull --rebase -q
          git push -q
