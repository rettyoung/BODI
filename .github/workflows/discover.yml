name: portal-discovery
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated target ids (blank = all)'
        required: false
        default: ''
  push:
    paths:
      - 'collector/discover.py'
permissions:
  contents: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Discover
        working-directory: collector
        run: python discover.py ${{ github.event.inputs.targets }}
      - name: Commit results
        run: |
          git config user.name "griddocket-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery
          git commit -q -m "discovery $(date -u +%FT%TZ)" || exit 0
          git pull --rebase -q && git push -q
