name: nightly-collect
on:
  schedule:
    # 06:17 UTC = 02:17 ET (EDT) / 01:17 ET (EST). Off the hour to avoid GitHub's top-of-hour queue.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Space-separated adapter names (blank = all)'
        required: false
        default: ''
  push:
    paths:
      - 'collector/run.py'
      - 'collector/adapters.py'
      - 'config/watchlist.yaml'
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect
        working-directory: collector
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python run.py ${{ github.event.inputs.sources }}
      - name: Commit
        if: always()
        run: |
          git config user.name "griddocket-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "collect $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
      - name: Open an issue when a source fails twice running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import json, subprocess
          h = json.load(open("data/health/latest.json"))
          bad = {k: v for k, v in h["sources"].items() if v.get("status") != "ok" and v.get("consecutive_failures", 0) >= 2}
          if bad:
              body = "\n".join(f"- **{k}**: {v.get('status')} ({v.get('consecutive_failures')} runs) {v.get('error','')}" for k, v in bad.items())
              subprocess.run(["gh", "issue", "create", "--title", f"Collector: {len(bad)} source(s) failing — {h['run_id']}",
                              "--body", body + "\n\nThe Monday Sweep reads this and proposes a fix by pull request."], check=False)
          EOF
