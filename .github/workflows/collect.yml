name: nightly-collect
on:
  schedule:
    # GitHub runs scheduled events best-effort: under load they can start hours late or be dropped
    # (the 06:17 run of 2026-10-04 started at 12:26). So there are three triggers each night, all off the
    # hour, and the guard step below lets only the first one that starts do the work — agencies still see
    # one collection per night. The last (08:41 UTC) finishes before the Monday Sweep (10:54 UTC in PDT,
    # 11:54 UTC in PST).
    - cron: '43 4 * * *'    # 21:43 PDT / 20:43 PST
    - cron: '17 6 * * *'    # 23:17 PDT / 22:17 PST
    - cron: '41 8 * * *'    # 01:41 PDT / 00:41 PST
  workflow_dispatch:
    inputs:
      sources:
        description: 'Space-separated adapter names (blank = all)'
        required: false
        default: ''
      backfill_since:
        description: 'YYYY-MM-DD: one-off history pull into data/backfill/ (blank = normal nightly run)'
        required: false
        default: ''
  push:
    paths:
      - 'collector/run.py'
      - 'collector/adapters.py'
      - 'collector/adapters2.py'
      - 'collector/adapters3.py'
      - 'config/watchlist.yaml'
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # the newest main at job start — a scheduled or queued event otherwise checks out the commit that
          # existed when the event was created, which can be hours old and predate the previous run's data
          ref: main
      - name: Guard — skip if tonight's full collection already ran
        id: guard
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os
          age = None
          try:
              s = json.load(open("data/state/collector_state.json")).get("last_full_run") or {}
              fin = dt.datetime.fromisoformat(s["finished"].replace("Z", "+00:00"))
              age = (dt.datetime.now(dt.timezone.utc) - fin).total_seconds() / 3600
          except Exception as e:
              print("no usable last_full_run:", repr(e))
          skip = age is not None and age < 6
          print(f"last full run finished {'?' if age is None else round(age, 1)} h ago -> {'skip' if skip else 'run'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          EOF
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect
        if: steps.guard.outputs.skip != 'true'
        working-directory: collector
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          NRC_APS_KEY: ${{ secrets.NRC_APS_KEY }}
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          BACKFILL_SINCE: ${{ github.event.inputs.backfill_since }}
          MAX_DOCS: ${{ github.event.inputs.backfill_since && '450' || '160' }}
        run: python run.py ${{ github.event.inputs.sources }}
      - name: Commit
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "griddocket-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "collect $(date -u +%FT%TZ)" || exit 0
          # during a rebase "-X theirs" keeps THIS run's version of a conflicting data file (it is the newer one)
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs -q && git push -q; then echo pushed; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          echo "::error::could not push collected data"; exit 1
      - name: Open an issue when a source fails twice running
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BF: ${{ github.event.inputs.backfill_since }}
        run: |
          python - <<'EOF'
          import json, subprocess
          import os
          if os.environ.get("BF"):
              raise SystemExit(0)
          h = json.load(open("data/health/latest.json"))
          bad = {k: v for k, v in h["sources"].items()
                 if v.get("status") not in ("ok", "SKIPPED_RUN_DEADLINE") and v.get("consecutive_failures", 0) >= 2}
          title = "Collector health: sources failing on consecutive runs"
          repo = os.environ["GITHUB_REPOSITORY"]
          r = subprocess.run(["gh", "api", f"repos/{repo}/issues?state=open&per_page=100"], capture_output=True, text=True)
          try:
              num = next((i["number"] for i in json.loads(r.stdout or "[]") if i.get("title") == title), None)
          except Exception:
              print("issue lookup failed:", r.stderr[:300]); num = None
          if bad:
              body = (f"Run {h['run_id']}\n\n" + "\n".join(
                  f"- **{k}**: {v.get('status')} ({v.get('consecutive_failures')} runs) {v.get('error','')}" for k, v in bad.items())
                  + "\n\nUpdated each night. The Monday Sweep reads this and proposes a fix by pull request.")
              if num:
                  subprocess.run(["gh", "issue", "edit", str(num), "--body", body], check=False)
              else:
                  subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=False)
          elif num:
              subprocess.run(["gh", "issue", "close", str(num), "--comment", f"All sources healthy as of {h['run_id']}."], check=False)
          EOF
